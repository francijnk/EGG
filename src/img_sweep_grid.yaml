# wandb sweep --project cezary_test IMG_SWEEP.YAML
program: train.py
name: img_loss_sweep
method: grid
metric:
  goal: maximize
  name: train/accuracy
parameters:
  label_coeff:
    values: [0, 0.50]
  random_seed:
    values: [0, 1, 2, 3, 4]
command:  
- python3
- -m 
- src.train
- --temperature_end=1
- --image_input
- --results_folder=runs/
- --wandb_entity=koala_lab
- --data_path=/home/cezary/Projects/EGG/src/data/input_data/obverter-5-256-64.npz
- --sender_lr=0.0005
- --receiver_lr=0.0001
- --wandb_project=cezary_test
- --filename=sweep
- --temperature_start=1.5
- --weight_decay=0.01
- --optim=adamw
- --max_len=4
- --n_epochs=100
- --warmup_steps=250
- --sender_hidden=128
- --receiver_hidden=128
- --vocab_size=10
- --length_cost=0.01
- --batch_size=32
- --embedding=16
- ${args_no_boolean_flags}
